<div class="form-container">
  <div *ngIf="isLoading" class="loading">
    <mat-spinner diameter="50"></mat-spinner>
    <p>Loading...</p>
  </div>

  <div *ngIf="!isLoading">
    <h2>{{ isEdit ? 'Edit Member' : 'Create New Member' }}</h2>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" placeholder="Enter member name">
        <mat-error *ngIf="form.get('name')?.hasError('required')">
          Name is required
        </mat-error>
        <mat-error *ngIf="form.get('name')?.hasError('minlength')">
          Name must be at least 2 characters
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Age</mat-label>
        <input matInput type="number" formControlName="age" placeholder="Enter age">
        <mat-error *ngIf="form.get('age')?.hasError('required')">
          Age is required
        </mat-error>
        <mat-error *ngIf="form.get('age')?.hasError('min')">
          Age must be at least 1
        </mat-error>
        <mat-error *ngIf="form.get('age')?.hasError('max')">
          Age cannot exceed 150
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" class="form-field">
        <mat-label>City</mat-label>
        <input matInput formControlName="city" placeholder="Enter city">
        <mat-error *ngIf="form.get('city')?.hasError('required')">
          City is required
        </mat-error>
        <mat-error *ngIf="form.get('city')?.hasError('minlength')">
          City must be at least 2 characters
        </mat-error>
      </mat-form-field>

      <div class="button-group">
        <button type="button" mat-button (click)="onCancel()">Cancel</button>
        <button type="submit" mat-raised-button color="primary" [disabled]="!form.valid">
          {{ isEdit ? 'Update' : 'Create' }}
        </button>
      </div>
    </form>
  </div>
</div>
